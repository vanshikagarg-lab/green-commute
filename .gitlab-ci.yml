variables:
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"  # Defines the location of the analysis task cache
  GIT_DEPTH: "0"  # Tells git to fetch all the branches of the project, required by the analysis task
sonarcloud-check:
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  stages:
    - dependency-install
    - test-run
    - sonarcloud-scan
  only:
    - merge_requests
    - main

dependency-install:
  stage: dependency-install
  script:
    - npm install
  cache:
    paths:
      - node_modules/
  artifacts:
    expire_in: 1 days
    when: on_success
    paths:
      - node_modules/

test-run:
  stage: test-run
  dependencies:
    - npm
  script:
    - npm run test
  
sonarcloud-scan:
  stage: sonarcloud-scan
  dependencies:
    - npm
  script:
    - sonar-scanner