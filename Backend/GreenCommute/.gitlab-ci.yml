image: maven:latest
variables:
  SONAR_TOKEN: "deff1784f41296ebd282ecae5da99335c7750bec"
  SONAR_HOST_URL: "https://sonarcloud.io"
  GIT_DEPTH: 0

sonarqube-check-backend:
  stage: sonar-backend
  script:
    - cd "${CI_PROJECT_DIR}/Backend/GreenCommute"
    - mvn verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=B32_Green-Commute_Backend -Dsonar.qualitygate.wait=true
  allow_failure: true
  only:
    - merge_requests
    - main
